{% extends "base.html" %}

{% block content %}
     <!-- STEP NAVIGATION -->
    <nav class="step-navigation">

        <div class="step active">
            <div class="step-number">1</div>
            <span>Identify</span>
        </div>

        <span class="step-arrow">›</span>

        <div class="step">
            <div class="step-number">2</div>
            <span>Download</span>
        </div>

        <span class="step-arrow">›</span>

        <div class="step">
            <div class="step-number">3</div>
            <span>Install</span>
        </div>

    </nav>


    <!-- ACCOUNT BANNER -->
    <div class="account-banner">
        Already have an HP account? Select from the products you own.
        <a href="#">Sign in</a>
        /
        <a href="#">Create an account</a>
    </div>


    <!-- MAIN CONTENT -->

            <!-- PRINTER -->

                <span>Printer</span>

            <!-- LAPTOP -->
            <a href="#" class="product-card">

                <svg viewBox="0 0 48 48">
                    <rect x="8" y="10" width="32" height="25" rx="2"/>
                    <path d="M5 39h38"/>

                <span>Laptop</span>

            <!-- DESKTOP -->

                <svg viewBox="0 0 48 48">

                </svg>

                <span>Poly</span>

            </a>


            <!-- OTHER -->
            <a href="#" class="product-card">

                <svg viewBox="0 0 48 48">
                    <rect x="5" y="8" width="34" height="24" rx="3"/>
                    <path d="M10 37h24"/>
