{% extends 'base.html' %}


<main class="login-panel">
        <svg class="brand-mark" viewBox="0 0 108 85" role="img" aria-label="E-Spares">
            <defs>
                <linearGradient id="left" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#00d6e9"/><stop offset="1" stop-color="#007fae"/></linearGradient>
                <linearGradient id="middle" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2476ff"/><stop offset="1" stop-color="#1948d8"/></linearGradient>
                <linearGradient id="right" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#21dc83"/><stop offset="1" stop-color="#008c62"/></linearGradient>
            </defs>
            <path d="M14 22c8-9 19-7 24 4l13 31c3 8-1 16-9 19-8 3-17-1-20-9L9 39c-3-7-2-13 5-17z" fill="url(#left)"/>
            <path d="M27 15c8-8 20-7 26 2l11 18 9-16c5-9 15-11 23-6 8 5 10 16 5 24L78 72c-6 10-19 11-26 2L32 43c-4-7-12-19-5-28z" fill="url(#middle)"/>
            <path d="M71 15c8-9 21-8 27 2l5 9c4 8 1 17-7 21-8 4-17 1-21-7l-7-12c-3-5-2-10 3-13z" fill="url(#right)"/>
        </svg>
        <h1>Welcome to E-Spares</h1>

        <form method="post" novalidate>
            {% csrf_token %}
            <label for="{{ form.username.id_for_label }}">Email address</label>
            <input class="login-input" type="text" name="{{ form.username.html_name }}" id="{{ form.username.id_for_label }}"
                   value="{{ form.username.value|default:'' }}" placeholder="name@example.com" autocomplete="username" autofocus required>
            {% if form.username.errors %}<p class="error-message">{{ form.username.errors|join:', ' }}</p>{% endif %}
            <label for="{{ form.password.id_for_label }}" class="visually-hidden">Password</label>
            <input class="login-input visually-hidden" type="password" name="{{ form.password.html_name }}" id="{{ form.password.id_for_label }}" autocomplete="current-password">
            {% if form.non_field_errors %}<p class="error-message">{{ form.non_field_errors|join:', ' }}</p>{% endif %}
            <button class="login-button" type="submit" disabled>Sign In</button>
        </form>
        <a class="signup-link" href="{% url 'signup' %}">Sign up</a>
        <hr class="separator">
        <a class="help-link" href="mailto:support@espares.example">
            Need help signing in?
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M9 2h5v5M14 2 7 9"/><path d="M12 9v4H2V3h4"/></svg>
        </a>
    </main>
